<title>Cross-Skill Mapping Overview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap');
  /* Light theme only, unconditionally — matches the Cigna Clinical Headcount piece's
     convention for this kind of leadership brief (dark mode was explicitly rejected). */
  :root { --ground: #E7EAF0; --ink: #1B2036; --ink-faint: #8891A3; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--ground); color: var(--ink); font-family: "Inter", sans-serif; display: flex; flex-direction: column; }

  .toolbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; gap: 12px; background: #fff; border-bottom: 1px solid #E2E5EC; }
  .toolbar .app-name { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 14px; color: var(--ink); }
  .toolbar .actions { display: flex; gap: 8px; align-items: center; }
  .btn { font-family: "Inter", sans-serif; font-size: 12.5px; font-weight: 700; border-radius: 7px; padding: 8px 13px; border: 1px solid #E2E5EC; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: #F4F5F8; color: var(--ink); }
  .btn.primary { background: #F97316; color: #fff; border-color: transparent; }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .status-msg { font-size: 11.5px; color: var(--ink-faint); }

  .stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: var(--ground); }
  #posterWrap { height: 100%; max-width: 100%; display: flex; }
  #posterWrap svg { height: 100%; width: auto; max-width: 100%; border-radius: 14px; box-shadow: 0 16px 50px rgba(0,0,0,0.18); display: block; background: #fff; }

  @media print {
    body { height: auto; overflow: visible; }
    .toolbar { display: none; }
    .stage { padding: 0; height: 100vh; background: #fff; }
    #posterWrap { height: 100vh; }
    #posterWrap svg { border-radius: 0; box-shadow: none; height: 100vh; width: auto; margin: 0 auto; }
    @page { margin: 0; }
  }
</style>

<div class="toolbar">
  <span class="app-name">Cross-Skill Mapping &mdash; Leadership Overview</span>
  <div class="actions">
    <span class="status-msg" id="statusMsg"></span>
    <button class="btn" id="pptxBtn" type="button">&#128202; Download PPTX</button>
    <button class="btn" id="pdfBtn" type="button">&#128196; Download PDF</button>
    <button class="btn primary" id="downloadBtn" type="button">&#8681; Download PNG</button>
  </div>
</div>

<div class="stage">
  <div id="posterWrap"></div>
</div>

        { profile: 'NON-RN', sp: 'Humana CIT Special Projects', flows: [{ to: 'CIT Fax' }], remark: 'PHL Humana P2P; PHL Humana CIT.' },
        { profile: 'NON-RN', sp: 'PHL Humana CIT', notSpecified: true },
        { profile: 'NON-RN', sp: 'PHL Humana P2P', notSpecified: true },
        { profile: 'PHRN', sp: 'Humana PHP Clinical Appeals', flows: [{ to: 'IP and OP', count: 9 }] },
        { profile: 'PHRN', sp: 'Humana PHP Clinical Expedited Appeals',
          flows: [
            { from: 'Triage', to: 'Clinical Prep', count: 24 },
            { from: 'Genetics', to: 'Medicare Pre Auth', count: 19 },
            { from: 'Transplant', to: 'Genetics', count: 5 },
            { from: 'Diagnostic Imaging', to: 'Genetics', count: 5 },
            { from: 'Pre Auth', to: 'DME', count: 2 },
            { from: 'Sleep', to: 'Pre Auth', count: 3 },
            { from: 'DME', to: 'Pre Auth', count: 5 },
          ],
          remark: 'Row boundary was ambiguous in the source photo — verify against live file.' },
        { profile: 'USRN', sp: 'Humana PHP CIT Clinical', notSpecified: true },
        { profile: 'USRN', sp: 'Humana PHP CIT Clinical CCR DME', notSpecified: true,
          notSpecText: 'Not separately legible in source (see DME → Pre Auth: 5 above).' },
      ]
    },
    {
      name: 'SmithRx',
      rows: [
        { profile: 'NON-RN', sp: 'Intake',
          flows: [{ from: 'Intake Data Entry', to: 'IRO (Appeal Review)' }] },
      ]
    },
  ];
  const TOTAL_ROWS = ACCOUNTS.reduce((s, a) => s + a.rows.length, 0);
  // Hard runtime guard, same convention as the Cigna headcount piece: if a future
  // data edit silently drops/adds a row, this fails loudly instead of quietly
  // under-representing the source.
  if (TOTAL_ROWS !== 26) console.error('Row count mismatch — expected 26 sub-process rows, got ' + TOTAL_ROWS);

  // ---------- Palette: light paper, dark ink, one accent reserved for emphasis (counts/callouts) ----------
  // A restrained second hue set distinguishes the three clinical profiles per the
  // brief's allowance — three flat colors, not a rainbow, used only on small
  // profile pills.
  const PAL = {
    bg: '#FFFFFF', ink: '#1B2036', muted: '#5B6478', faint: '#8891A3',
    accent: '#F97316', accentDeep: '#9A3412', accentTint: '#FFF4EC',
    rule: '#E7E9EF', track: '#F1F2F5', headerTint: '#F7F8FA',
    cardBg: '#FBFBFD', cardBorder: '#E4E7EE',
    chipBg: '#F1F2F5', chipInk: '#3B4256',
    nonrn: '#966016', nonrnTint: '#FCF0DA',
    phrn: '#0F766E', phrnTint: '#E1F5F2',
    usrn: '#1D4ED8', usrnTint: '#E8EFFE',
    gapBg: '#FFF7E6', gapBorder: '#EFCB74', gapInk: '#7A5900',
  };
  const W = 1600;
  const CX = 100, CW = 1400; // wide editorial grid, matches situation-brief.html/Cigna-headcount convention
  const COL_GAP = 36, CARD_GAP = 28;
  const COL_W = (CW - COL_GAP) / 2; // 682 — two-column card grid

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function wrapText(text, maxChars) {
    const words = text.split(' '); const lines = []; let cur = '';
    words.forEach(w => { if ((cur + ' ' + w).trim().length > maxChars) { lines.push(cur.trim()); cur = w; } else { cur = (cur + ' ' + w).trim(); } });
    if (cur) lines.push(cur);
    return lines;
  }
  // Text-width estimate so nothing is placed against a hand-guessed fixed offset
  // (the recurring overlap bug this project has hit before). safety>1 pads the
  // estimate further, which is deliberately conservative for the dense, small-
  // font chip layout used throughout this piece.
  function estWidth(str, fontSize, family, weight, safety) {
    const factor = family === 'Archivo' ? (weight >= 800 ? 0.64 : 0.58) : (weight >= 700 ? 0.56 : 0.50);
    return str.length * fontSize * factor * (safety || 1);
  }
  // Chars-per-line estimate for wrapText, derived the same way, with its own
  // safety margin so wrapped paragraph text never runs past its column.
  function maxCharsFor(availPx, fontSize, family, weight) {
    const perChar = estWidth('x', fontSize, family, weight, 1.12);
    return Math.max(12, Math.floor(availPx / perChar));
  }

  // ---------- Chip primitives (dual-mode: parts=null measures only, parts=array draws) ----------
  const CHIP_H = 24, CHIP_GAP_X = 8, CHIP_GAP_Y = 10;

  function flowChip(f, x, y, parts) {
    const label = (f.from ? f.from + ' → ' : '→ ') + f.to;
    const labelSize = 12, labelWeight = 600;
    const labelW = estWidth(label, labelSize, 'Inter', labelWeight, 1.1);
    const pillW = labelW + 20;
    const hasCount = f.count != null;
    const countStr = hasCount ? String(f.count) : '';
    const countSize = 13, countWeight = 800;
    const countW = hasCount ? estWidth(countStr, countSize, 'Archivo', countWeight, 1.1) : 0;
    const totalW = pillW + (hasCount ? 10 + countW : 0);
    if (parts) {
      parts.push(`<rect x="${x}" y="${y}" width="${pillW}" height="${CHIP_H}" rx="12" fill="${PAL.chipBg}"/>`);
      parts.push(`<text x="${x + 10}" y="${y + 16}" font-family="Inter" font-weight="${labelWeight}" font-size="${labelSize}" fill="${PAL.chipInk}">${esc(label)}</text>`);
      if (hasCount) {
        parts.push(`<text x="${x + pillW + 10}" y="${y + 17}" font-family="Archivo" font-weight="${countWeight}" font-size="${countSize}" fill="${PAL.accentDeep}">${esc(countStr)}</text>`);
      }
    }
    return totalW;
  }
  function tagChip(text, x, y, parts) {
    const size = 9.5, weight = 800;
    const w = estWidth(text, size, 'Inter', weight, 1.15) + 18;
    if (parts) {
      parts.push(`<rect x="${x}" y="${y}" width="${w}" height="${CHIP_H}" rx="12" fill="none" stroke="${PAL.faint}" stroke-width="1"/>`);
      parts.push(`<text x="${x + w / 2}" y="${y + 15.5}" text-anchor="middle" font-family="Inter" font-weight="${weight}" font-size="${size}" letter-spacing="0.5" fill="${PAL.muted}">${esc(text.toUpperCase())}</text>`);
    }
    return w;
  }
  function skillChip(text, x, y, parts) {
    const size = 12, weight = 600;
    const w = estWidth(text, size, 'Inter', weight, 1.1) + 20;
    if (parts) {
      parts.push(`<rect x="${x}" y="${y}" width="${w}" height="${CHIP_H}" rx="12" fill="${PAL.chipBg}"/>`);
      parts.push(`<text x="${x + w / 2}" y="${y + 16}" text-anchor="middle" font-family="Inter" font-weight="${weight}" font-size="${size}" fill="${PAL.chipInk}">${esc(text)}</text>`);
    }
    return w;
  }

  // Packs a row of chip items left-to-right within availW, wrapping to a new
  // line when the next chip would overflow. Returns the block height; if
  // `parts` is supplied, also draws every chip at its packed position.
  function packChips(items, x0, y0, availW, parts) {
    let cx = x0, cy = y0, started = false;
    items.forEach(item => {
      let w;
      if (item.kind === 'flow') w = flowChip(item.flow, 0, 0, null);
      else if (item.kind === 'tag') w = tagChip(item.text, 0, 0, null);
      else w = skillChip(item.text, 0, 0, null);
      if (started && cx + w > x0 + availW) { cx = x0; cy += CHIP_H + CHIP_GAP_Y; }
      if (parts) {
        if (item.kind === 'flow') flowChip(item.flow, cx, cy, parts);
        else if (item.kind === 'tag') tagChip(item.text, cx, cy, parts);
        else skillChip(item.text, cx, cy, parts);
      }
      cx += w + CHIP_GAP_X;
      started = true;
    });
    return (cy - y0) + CHIP_H;
  }

  const PROFILE_COLORS = {
    'NON-RN': [PAL.nonrn, PAL.nonrnTint],
    'PHRN': [PAL.phrn, PAL.phrnTint],
    'USRN': [PAL.usrn, PAL.usrnTint],
  };

  // Builds one account card. Dual-mode like the chip primitives: call once with
  // parts=null to measure height for the column-packing decision, then again
  // with the real parts array + final originX/originY once that decision is
  // made — so every coordinate below is correct on the draw pass, and nothing
  // is ever placed before its own height is known (avoids the overlap bug this
  // project has hit before when offsets were hand-guessed ahead of content).
  function buildCard(acc, originX, originY, width, parts) {
    const pad = 22;
    const contentX = originX + pad;
    const contentW = width - 2 * pad;
    let y = originY + pad;

    const headerBaseline = y + 16;
    if (parts) {
      parts.push(`<text x="${contentX}" y="${headerBaseline}" font-family="Archivo" font-weight="800" font-size="21" fill="${PAL.ink}">${esc(acc.name)}</text>`);
      const pillText = `${acc.rows.length} SUB-PROCESS${acc.rows.length === 1 ? '' : 'ES'}`;
      const pillW = estWidth(pillText, 10.5, 'Inter', 800, 1.1) + 20;
      const pillX = originX + width - pad - pillW;
      parts.push(`<rect x="${pillX}" y="${headerBaseline - 14}" width="${pillW}" height="22" rx="11" fill="${PAL.track}"/>`);
      parts.push(`<text x="${pillX + pillW / 2}" y="${headerBaseline + 1}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="10.5" letter-spacing="0.4" fill="${PAL.muted}">${esc(pillText)}</text>`);
    }
    y = headerBaseline + 14;
    if (parts) parts.push(`<line x1="${contentX}" y1="${y}" x2="${originX + width - pad}" y2="${y}" stroke="${PAL.rule}" stroke-width="1"/>`);
    y += 22;

    acc.rows.forEach((row, ri) => {
      const [pc, pt] = PROFILE_COLORS[row.profile];
      const profSize = 10, profH = 18;
      const profW = estWidth(row.profile, profSize, 'Inter', 800, 1.1) + 16;
      if (parts) {
        parts.push(`<rect x="${contentX}" y="${y}" width="${profW}" height="${profH}" rx="9" fill="${pt}"/>`);
        parts.push(`<text x="${contentX + profW / 2}" y="${y + 13}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="${profSize}" letter-spacing="0.4" fill="${pc}">${esc(row.profile)}</text>`);
      }
      const spX = contentX + profW + 10;
      const spAvail = contentW - profW - 10;
      const spSize = 14.5;
      const spLines = wrapText(row.sp, maxCharsFor(spAvail, spSize, 'Inter', 700));
      if (parts) {
        spLines.forEach((line, li) => {
          parts.push(`<text x="${spX}" y="${y + 13 + li * 19}" font-family="Inter" font-weight="700" font-size="${spSize}" fill="${PAL.ink}">${esc(line)}</text>`);
        });
      }
      y += Math.max(profH, spLines.length * 19) + 10;

      if (row.notSpecified) {
        const text = '— ' + (row.notSpecText || 'Not specified in source.');
        const lines = wrapText(text, maxCharsFor(contentW, 12.5, 'Inter', 600));
        if (parts) lines.forEach((line, li) => parts.push(`<text x="${contentX}" y="${y + 9 + li * 17}" font-family="Inter" font-weight="600" font-style="italic" font-size="12.5" fill="${PAL.faint}">${esc(line)}</text>`));
        y += lines.length * 17 + 6;
      } else {
        const items = [];
        if (row.tag) items.push({ kind: 'tag', text: row.tag });
        if (row.flows) row.flows.forEach(f => items.push({ kind: 'flow', flow: f }));
        if (row.skills) row.skills.forEach(s => items.push({ kind: 'skill', text: s }));
        const chipH = packChips(items, contentX, y, contentW, parts);
        y += chipH;
        if (row.skillCount != null) {
          const label = `= ${row.skillCount} combined (per source)`;
          if (parts) parts.push(`<text x="${contentX}" y="${y + 16}" font-family="Archivo" font-weight="800" font-size="13" fill="${PAL.accentDeep}">${esc(label)}</text>`);
          y += 24;
        }
        y += 8;
      }

      if (row.remark) {
        const lines = wrapText('Note: ' + row.remark, maxCharsFor(contentW, 11.5, 'Inter', 500));
        if (parts) lines.forEach((line, li) => parts.push(`<text x="${contentX}" y="${y + 9 + li * 15}" font-family="Inter" font-weight="500" font-style="italic" font-size="11.5" fill="${PAL.muted}">${esc(line)}</text>`));
        y += lines.length * 15 + 6;
      }

      y += 12;
      if (ri < acc.rows.length - 1 && parts) {
        parts.push(`<line x1="${contentX}" y1="${y - 6}" x2="${originX + width - pad}" y2="${y - 6}" stroke="${PAL.rule}" stroke-width="1" stroke-dasharray="1,3"/>`);
      }
    });

    if (acc.footnote) {
      const lines = wrapText('* ' + acc.footnote, maxCharsFor(contentW, 11, 'Inter', 500));
      if (parts) lines.forEach((line, li) => parts.push(`<text x="${contentX}" y="${y + 9 + li * 15}" font-family="Inter" font-weight="500" font-style="italic" font-size="11" fill="${PAL.faint}">${esc(line)}</text>`));
      y += lines.length * 15 + 6;
    }

    y += pad - 12;
    return y - originY;
  }

  function buildSVG() {
    const parts = [];
    let y = 0;
    const cx = CX, cw = CW;
    const rule = (gapAfter) => { parts.push(`<line x1="${cx}" y1="${y}" x2="${cx + cw}" y2="${y}" stroke="${PAL.rule}" stroke-width="1"/>`); y += gapAfter; };
    const sectionLabel = (text) => { parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="800" font-size="15" letter-spacing="2" fill="${PAL.faint}">${esc(text)}</text>`); y += 34; };

    // ---- Masthead ----
    y = 56;
    parts.push(`<circle cx="${cx + 5}" cy="${y - 6}" r="4.5" fill="${PAL.accent}"/>`);
    parts.push(`<text x="${cx + 16}" y="${y}" font-family="Inter" font-weight="700" font-size="14" letter-spacing="2.2" fill="${PAL.faint}">CROSS-SKILL MAPPING &#8226; LEADERSHIP OVERVIEW</text>`);
    parts.push(`<text x="${cx + cw}" y="${y}" text-anchor="end" font-family="Inter" font-weight="700" font-size="13" letter-spacing="1" fill="${PAL.faint}">INTERNAL &#8226; LEADERSHIP ONLY</text>`);

    y += 54;
    parts.push(`<text x="${cx}" y="${y}" font-family="Archivo" font-weight="900" font-size="42" fill="${PAL.ink}">Cross-Skill Mapping Overview</text>`);

    y += 36;
    const subtitle = '26 sub-process rows across 5 accounts — which sub-process is cross-trained into which, and roughly how much cross-skill volume exists where, per the source workbook.';
    const subLines = wrapText(subtitle, maxCharsFor(cw, 17, 'Inter', 500));
    subLines.forEach((line, i) => parts.push(`<text x="${cx}" y="${y + i * 24}" font-family="Inter" font-weight="500" font-size="17" fill="${PAL.muted}">${esc(line)}</text>`));
    y += (subLines.length - 1) * 24 + 30;

    // ============================================================
    // COVERAGE DISCLOSURE — must stay clearly visible, not buried in a
    // footnote: rows 8–14 of the source sheet were hidden/filtered when
    // this was transcribed and are not represented anywhere below.
    // ============================================================
    const bannerPad = 20;
    const bannerTextX = cx + bannerPad + 34;
    const bannerAvail = cw - bannerPad * 2 - 34;
    const bannerText = 'Coverage note: source rows 8–14 (per the captured worksheet’s own row numbers) were hidden/filtered when this was transcribed — whatever accounts/sub-processes live in those rows are NOT represented on this map. Pull the live file for full coverage if needed.';
    const bannerLines = wrapText(bannerText, maxCharsFor(bannerAvail, 13.5, 'Inter', 600));
    const bannerContentStart = parts.length;
    const bannerTop = y;
    const bannerH = bannerPad * 2 + bannerLines.length * 19 - 4;
    parts.push(`<circle cx="${cx + bannerPad + 12}" cy="${bannerTop + bannerH / 2}" r="12" fill="${PAL.gapBorder}"/>`);
    parts.push(`<text x="${cx + bannerPad + 12}" y="${bannerTop + bannerH / 2 + 5}" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="15" fill="#5C4400">!</text>`);
    bannerLines.forEach((line, i) => parts.push(`<text x="${bannerTextX}" y="${bannerTop + bannerPad + 4 + i * 19}" font-family="Inter" font-weight="600" font-size="13.5" fill="${PAL.gapInk}">${esc(line)}</text>`));
    parts.splice(bannerContentStart, 0,
      `<rect x="${cx}" y="${bannerTop}" width="${cw}" height="${bannerH}" rx="10" fill="${PAL.gapBg}"/>`,
      `<rect x="${cx}" y="${bannerTop}" width="5" height="${bannerH}" rx="2.5" fill="${PAL.gapBorder}"/>`
    );
    y = bannerTop + bannerH + 28;

    // ============================================================
    // LEGEND — profile colors, then how to read a chip. Two short rows
    // so nothing needs to wrap or crowd the masthead-style single line.
    // ============================================================
    const legendY1 = y + 6;
    let lx = cx;
    ['NON-RN', 'PHRN', 'USRN'].forEach(p => {
      const [pc] = PROFILE_COLORS[p];
      parts.push(`<circle cx="${lx + 5}" cy="${legendY1 - 4}" r="5" fill="${pc}"/>`);
      parts.push(`<text x="${lx + 16}" y="${legendY1}" font-family="Inter" font-weight="700" font-size="12.5" fill="${PAL.muted}">${esc(p)}</text>`);
      lx += 16 + estWidth(p, 12.5, 'Inter', 700, 1.15) + 30;
    });
    y = legendY1 + 30;

    const legendY2 = y;
    let lx2 = cx;
    // Sample "flow with count" chip.
    const sampleFlowW = flowChip({ from: 'A', to: 'B', count: 12 }, lx2, legendY2, parts);
    parts.push(`<text x="${lx2 + sampleFlowW + 12}" y="${legendY2 + 16}" font-family="Inter" font-weight="500" font-size="12.5" fill="${PAL.muted}">flow, with count from source</text>`);
    lx2 += sampleFlowW + 12 + estWidth('flow, with count from source', 12.5, 'Inter', 500, 1.15) + 34;
    // Sample "flow, no count" chip.
    const sampleFlowW2 = flowChip({ from: 'A', to: 'B' }, lx2, legendY2, parts);
    parts.push(`<text x="${lx2 + sampleFlowW2 + 12}" y="${legendY2 + 16}" font-family="Inter" font-weight="500" font-size="12.5" fill="${PAL.muted}">flow, no count given in source</text>`);
    lx2 += sampleFlowW2 + 12 + estWidth('flow, no count given in source', 12.5, 'Inter', 500, 1.15) + 34;
    parts.push(`<text x="${lx2}" y="${legendY2 + 16}" font-family="Inter" font-weight="600" font-style="italic" font-size="12.5" fill="${PAL.faint}">— not specified in source</text>`);
    y = legendY2 + 24 + 28;
    rule(30);

    // ============================================================
    // ACCOUNT CARDS — 5 accounts, all 26 rows shown individually. Cards
    // are sized from their own measured content (7-way variance in row
    // count/density across accounts, from SmithRx's 1 row to Humana's
    // 11), then packed into 2 columns with a greedy shortest-column-next
    // placement so the layout stays balanced without hand-picking which
    // account goes where.
    // ============================================================
    sectionLabel('CROSS-SKILL MAP — BY ACCOUNT (ALL 26 SUB-PROCESS ROWS)');
    const gridTop = y;
    const colX = [cx, cx + COL_W + COL_GAP];
    const colH = [0, 0];
    const measured = ACCOUNTS.map(acc => ({ acc, h: buildCard(acc, 0, 0, COL_W, null) }));
    measured.sort((a, b) => b.h - a.h); // largest first (LPT-style balancing)
    measured.forEach(({ acc, h }) => {
      const col = colH[0] <= colH[1] ? 0 : 1;
      const originX = colX[col], originY = gridTop + colH[col];
      const insertIdx = parts.length;
      buildCard(acc, originX, originY, COL_W, parts);
      parts.splice(insertIdx, 0,
        `<rect x="${originX}" y="${originY}" width="${COL_W}" height="${h}" rx="12" fill="${PAL.cardBg}" stroke="${PAL.cardBorder}" stroke-width="1"/>`
      );
      colH[col] += h + CARD_GAP;
    });
    y = gridTop + Math.max(colH[0], colH[1]) + 10;
    rule(26);

    // ---- Footer ----
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="600" font-size="13" fill="${PAL.faint}">All 26 sub-process rows shown individually above — none rolled up or omitted. All rows have Cross-Skilled = Y in source.</text>`);
    y += 20;
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="500" font-size="13" fill="${PAL.faint}">Source: LOB Masterfile (Process Scope).xlsx — Cross-Skill_Mapping tab, SharePoint (ClinicalPillar2) • Transcribed 2026-08-26</text>`);
    y += 30; // bottom margin

    const H = Math.ceil(y);
    const fontStyle = `<style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');</style>`;
    const bg = `<rect x="0" y="0" width="${W}" height="${H}" fill="${PAL.bg}"/>`;
    return { svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${fontStyle}${bg}${parts.join('')}</svg>`, W, H };
  }

  const built = buildSVG();
  const svgMarkup = built.svg, W_OUT = built.W, H_OUT = built.H;
  document.getElementById('posterWrap').innerHTML = svgMarkup;

  async function rasterizeToCanvas(scale) {
    await document.fonts.ready;
    const blob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    const loaded = new Promise((resolve, reject) => { img.onload = resolve; img.onerror = () => reject(new Error('SVG failed to rasterize')); });
    img.src = url;
    await loaded;
    const canvas = document.createElement('canvas');
    canvas.width = W_OUT * scale; canvas.height = H_OUT * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, W_OUT, H_OUT);
    URL.revokeObjectURL(url);
    return canvas;
  }

  async function canvasToPdfBlob(canvas) {
    const jpegBlob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', 0.92));
    const jpegBytes = new Uint8Array(await jpegBlob.arrayBuffer());
    const w = canvas.width, h = canvas.height;
    const enc = new TextEncoder();
    const chunks = []; let pos = 0; const off = {};
    function push(x) { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); pos += b.length; }
    push('%PDF-1.4\n');
    off[1] = pos; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    off[2] = pos; push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
    off[3] = pos; push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
    off[4] = pos; push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
    push(jpegBytes); push('\nendstream\nendobj\n');
    const content = `q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;
    off[5] = pos; push(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    const xrefStart = pos;
    let xref = 'xref\n0 6\n0000000000 65535 f \n';
    for (let i = 1; i <= 5; i++) xref += String(off[i]).padStart(10, '0') + ' 00000 n \n';
    push(xref);
    push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
    return new Blob(chunks, { type: 'application/pdf' });
  }

  const statusMsg = document.getElementById('statusMsg');
  function setStatus(text, ms) { statusMsg.textContent = text; if (ms) setTimeout(() => { if (statusMsg.textContent === text) statusMsg.textContent = ''; }, ms); }

  async function offer(filename, blob) {
    let downloads;
    try { downloads = await claude.use('downloads'); } catch (e) { downloads = null; }
    if (!downloads) {
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setStatus('Opened in a new tab — save it from there.', 6000);
      return;
    }
    await downloads.save({ filename, data: blob });
    setStatus('Saved.', 4000);
  }

  document.getElementById('downloadBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget; btn.disabled = true; setStatus('Rendering…');
    try {
      const canvas = await rasterizeToCanvas(2);
      const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png'));
      await offer('cross-skill-mapping-overview.png', blob);
    } catch (err) {
      setStatus((err && err.code === 'declined') ? 'Cancelled.' : 'Could not generate the PNG.', 5000);
    } finally { btn.disabled = false; }
  });

  document.getElementById('pdfBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget; btn.disabled = true; setStatus('Rendering…');
    try {
      const canvas = await rasterizeToCanvas(2);
      const blob = await canvasToPdfBlob(canvas);
      await offer('cross-skill-mapping-overview.pdf', blob);
    } catch (err) {
      const code = err && err.code;
      if (code === 'declined') setStatus('Cancelled.', 5000);
      else if (code === 'extension_not_enabled') setStatus('PDF isn\'t available in this view — try Download PNG instead.', 7000);
      else setStatus('Could not generate the PDF.', 5000);
    } finally { btn.disabled = false; }
  });

  function base64ToBlob(base64Str, mime) {
    const byteChars = atob(base64Str);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    return new Blob([new Uint8Array(byteNumbers)], { type: mime });
  }

  document.getElementById('pptxBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget; btn.disabled = true; setStatus('Preparing PPTX…');
    try {
      const blob = base64ToBlob(PPTX_B64, 'application/vnd.openxmlformats-officedocument.presentationml.presentation');
      await offer('Cross-Skill-Mapping.pptx', blob);
    } catch (err) {
      const code = err && err.code;
      if (code === 'declined') setStatus('Cancelled.', 5000);
      else if (code === 'extension_not_enabled') setStatus('PPTX isn\'t available in this view — ask for the file directly instead.', 7000);
      else setStatus('Could not offer the PPTX.', 5000);
    } finally { btn.disabled = false; }
  });
