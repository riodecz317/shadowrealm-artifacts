<title>Situation Brief</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap');
  :root { --ground: #E7EAF0; --ink: #1B2036; --ink-faint: #8891A3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #05060A; --ink-faint: #7C879C; } }
  :root[data-theme="dark"] { --ground: #05060A; --ink-faint: #7C879C; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--ground); color: var(--ink); font-family: "Inter", sans-serif; display: flex; flex-direction: column; }

  .toolbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; gap: 12px; background: #fff; border-bottom: 1px solid #E2E5EC; }
  .toolbar .app-name { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 14px; color: var(--ink); }
  .toolbar .actions { display: flex; gap: 8px; align-items: center; }
  .btn { font-family: "Inter", sans-serif; font-size: 12.5px; font-weight: 700; border-radius: 7px; padding: 8px 13px; border: 1px solid #E2E5EC; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: #F4F5F8; color: var(--ink); }
  .btn.primary { background: #F97316; color: #fff; border-color: transparent; }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .status-msg { font-size: 11.5px; color: var(--ink-faint); }

  .stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: var(--ground); }
  #posterWrap { height: 100%; max-width: 100%; display: flex; }
  #posterWrap svg { height: 100%; width: auto; max-width: 100%; border-radius: 14px; box-shadow: 0 16px 50px rgba(0,0,0,0.18); display: block; }

  @media print {
    body { height: auto; overflow: visible; }
    .toolbar { display: none; }
    .stage { padding: 0; height: 100vh; background: #fff; }
    #posterWrap { height: 100vh; }
    #posterWrap svg { border-radius: 0; box-shadow: none; height: 100vh; width: auto; margin: 0 auto; }
    @page { margin: 0; }
  }
</style>

<div class="toolbar">
  <span class="app-name">Situation Brief &mdash; BCP Leadership Update</span>
  <div class="actions">
    <span class="status-msg" id="statusMsg"></span>
    <button class="btn" id="pdfBtn" type="button">&#128196; Download PDF</button>
    <button class="btn primary" id="downloadBtn" type="button">&#8681; Download PNG</button>
  </div>
</div>

<div class="stage">
  <div id="posterWrap"></div>
</div>

<script>
  // ---------- Palette: light paper, dark ink, muted blue-gray, orange used only for criticality/action ----------
  const PAL = {
    bg: '#FFFFFF', ink: '#1B2036', muted: '#5B6478', faint: '#8891A3',
    accent: '#F97316', accentDeep: '#9A3412',
    rule: '#E7E9EF', track: '#F1F2F5'
  };
  const W = 1600;
  const COL_X = 160, COL_W = 1280; // ~10% margins, ~80% content width — a wide editorial grid, not a narrow strip in a big empty frame
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function wrapText(text, maxChars) {
    const words = text.split(' '); const lines = []; let cur = '';
    words.forEach(w => { if ((cur+' '+w).trim().length > maxChars) { lines.push(cur.trim()); cur = w; } else { cur = (cur+' '+w).trim(); } });
    if (cur) lines.push(cur);
    return lines;
  }
  // Rough text-width estimate so a number's label always clears it, instead of
  // hand-guessed fixed offsets (which is exactly what caused the "15.UZON"
  // crowding — a two-digit 72px Archivo number is much wider than the 90px
  // gap I'd guessed). Deliberately generous, not exact font metrics.
  function estWidth(str, fontSize, family, weight) {
    const factor = family === 'Archivo' ? (weight >= 800 ? 0.64 : 0.58) : (weight >= 700 ? 0.56 : 0.50);
    return str.length * fontSize * factor;
  }
  function numLabel(parts, numX, y, numStr, numSize, numWeight, label, labelSize, labelWeight, gap, numColor, labelColor) {
    parts.push(`<text x="${numX}" y="${y}" font-family="Archivo" font-weight="${numWeight}" font-size="${numSize}" fill="${numColor}">${esc(numStr)}</text>`);
    const labelX = numX + estWidth(numStr, numSize, 'Archivo', numWeight) + gap;
    parts.push(`<text x="${labelX}" y="${y}" font-family="Inter" font-weight="${labelWeight}" font-size="${labelSize}" letter-spacing="1" fill="${labelColor}">${esc(label)}</text>`);
    return labelX;
  }

  function buildSVG() {
    const parts = [];
    let y = 0;
    const cx = COL_X, cw = COL_W;
    const sectionLabel = (text) => { parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="800" font-size="15" letter-spacing="2" fill="${PAL.faint}">${esc(text)}</text>`); y += 34; };
    const rule = (gapAfter) => { parts.push(`<line x1="${cx}" y1="${y}" x2="${cx+cw}" y2="${y}" stroke="${PAL.rule}" stroke-width="1"/>`); y += gapAfter; };

    // ---- Masthead ----
    y = 56;
    parts.push(`<circle cx="${cx+5}" cy="${y-6}" r="4.5" fill="${PAL.accent}"/>`);
    parts.push(`<text x="${cx+16}" y="${y}" font-family="Inter" font-weight="700" font-size="14" letter-spacing="2.2" fill="${PAL.faint}">BUSINESS CONTINUITY &#8226; LEADERSHIP UPDATE</text>`);
    parts.push(`<text x="${cx+cw}" y="${y-6}" text-anchor="end" font-family="Inter" font-weight="700" font-size="13" letter-spacing="1" fill="${PAL.faint}">INTERNAL &#8226; LEADERSHIP ONLY</text>`);

    y += 46;
    parts.push(`<text x="${cx}" y="${y}" font-family="Archivo" font-weight="900" font-size="46" fill="${PAL.ink}">Situation Brief</text>`);

    y += 32;
    const headline = 'Critical exposure is concentrated in Metro Manila, increasing the need for shared contingency capacity.';
    const hLines = wrapText(headline, 92);
    hLines.forEach((line, i) => parts.push(`<text x="${cx}" y="${y + i*24}" font-family="Inter" font-weight="500" font-size="17" fill="${PAL.muted}">${esc(line)}</text>`));
    y += (hLines.length - 1) * 24 + 30;
    rule(36);

    // ============================================================
    // ZONE A — CURRENT EXPOSURE: hero KPI at left, supporting stats
    // spread horizontally to its right on the SAME row, so the wide
    // column is actually used instead of everything stacking down a
    // narrow strip.
    // ============================================================
    sectionLabel('CURRENT EXPOSURE');
    const zoneATop = y;
    parts.push(`<text x="${cx}" y="${y+92}" font-family="Archivo" font-weight="900" font-size="104" fill="${PAL.accent}">12</text>`);
    parts.push(`<text x="${cx}" y="${y+120}" font-family="Inter" font-weight="700" font-size="17" fill="${PAL.accentDeep}">Critical &#8212; Awaiting Dispatch</text>`);
    const statsX = cx + 420;
    numLabel(parts, statsX, y + 40, '21', 30, 800, 'Open Cases', 16, 600, 16, PAL.ink, PAL.faint);
    numLabel(parts, statsX, y + 92, '8', 30, 800, 'Provinces Affected', 16, 600, 16, PAL.ink, PAL.faint);
    y = zoneATop + 120 + 30;
    rule(36);

    // ============================================================
    // ZONE B — WHERE IS THE EXPOSURE: four parallel columns across
    // the full content width, Metro Manila emphasized by color/size
    // (not nested) since it's the concentration the report calls out.
    // ============================================================
    sectionLabel('WHERE IS THE EXPOSURE?');
    const regions = [
      ['15', 'Luzon', false], ['8', 'Metro Manila', true],
      ['3', 'Visayas', false], ['3', 'Mindanao', false]
    ];
    const colW = cw / regions.length;
    const regionNumY = y + 58;
    regions.forEach(([v, label, emphasize], i) => {
      const colX = cx + i * colW;
      parts.push(`<text x="${colX}" y="${regionNumY}" font-family="Archivo" font-weight="900" font-size="${emphasize ? 60 : 46}" fill="${emphasize ? PAL.accent : PAL.ink}">${v}</text>`);
      parts.push(`<text x="${colX}" y="${regionNumY + 26}" font-family="Inter" font-weight="${emphasize ? 700 : 600}" font-size="16" fill="${emphasize ? PAL.accentDeep : PAL.muted}">${esc(label)}</text>`);
    });
    y = regionNumY + 26 + 34;
    rule(36);

    // ============================================================
    // ZONE C — WHAT IS DRIVING IT: ranked bars, larger type, one
    // consistent bar length scale, no borders.
    // ============================================================
    sectionLabel('WHAT IS DRIVING IT?');
    const hazards = [['Power Outage', 7], ['Typhoon', 6], ['Earthquake', 4], ['Internet Outage', 4]];
    const maxH = Math.max(...hazards.map(h => h[1]));
    hazards.forEach(([label, val]) => {
      numLabel(parts, cx, y, String(val).padStart(2,'0'), 22, 800, label, 19, 600, 24, PAL.ink, PAL.ink);
      const barY = y - 7, barX = cx + 320, barMaxW = cw - 320;
      parts.push(`<rect x="${barX}" y="${barY}" width="${barMaxW}" height="8" rx="4" fill="${PAL.track}"/>`);
      parts.push(`<rect x="${barX}" y="${barY}" width="${barMaxW*(val/maxH)}" height="8" rx="4" fill="${PAL.accent}"/>`);
      y += 42;
    });
    y += 14;
    rule(36);

    // ============================================================
    // ZONE D — EXECUTIVE IMPLICATION, then RECOMMENDED ACTION as a
    // visually distinct concluding panel (tinted fill + accent rule),
    // so the page's reading path ends on the decision, not more prose.
    // ============================================================
    sectionLabel('Executive Implication'.toUpperCase());
    const implication = 'Metro Manila represents 8 of 21 open cases, while Luzon accounts for 15. The concentration suggests a shared contingency response could address multiple exposures at once.';
    const iLines = wrapText(implication, 100);
    iLines.forEach((line, i) => parts.push(`<text x="${cx}" y="${y + i*26}" font-family="Inter" font-weight="500" font-size="18" fill="${PAL.ink}">${esc(line)}</text>`));
    y += (iLines.length - 1) * 26 + 44;

    // Recommendation panel — record exactly where this section's content
    // starts in `parts` so the background can be spliced in before it,
    // regardless of how many lines the action title happens to wrap to.
    const panelTop = y, panelPad = 28;
    const panelContentStart = parts.length;
    let py = panelTop + panelPad;
    parts.push(`<text x="${cx+panelPad}" y="${py}" font-family="Inter" font-weight="800" font-size="13" letter-spacing="1.8" fill="${PAL.accentDeep}">RECOMMENDED ACTION</text>`);
    py += 40;
    const actionLines = wrapText('Stand up a Metro Manila contingency pool', 42);
    actionLines.forEach((line, i) => parts.push(`<text x="${cx+panelPad}" y="${py + i*32}" font-family="Archivo" font-weight="900" font-size="26" fill="${PAL.ink}">${esc(line.toUpperCase())}</text>`));
    py += (actionLines.length - 1) * 32 + 34;
    parts.push(`<text x="${cx+panelPad}" y="${py}" font-family="Inter" font-weight="700" font-size="16" fill="${PAL.ink}">Shared generators + backup ISP capacity</text>`);
    py += 24;
    parts.push(`<text x="${cx+panelPad}" y="${py}" font-family="Inter" font-weight="500" font-size="13.5" font-style="italic" fill="${PAL.muted}">Prioritize shared response capacity where unresolved exposure is most concentrated.</text>`);
    py += panelPad;
    const panelH = py - panelTop;
    parts.splice(panelContentStart, 0,
      `<rect x="${cx}" y="${panelTop}" width="${cw}" height="${panelH}" rx="10" fill="#FFF4EC"/>`,
      `<rect x="${cx}" y="${panelTop}" width="6" height="${panelH}" rx="3" fill="${PAL.accent}"/>`
    );
    y = panelTop + panelH + 40;

    // ---- Footer: minimal, no implementation/process metadata ----
    rule(22);
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="600" font-size="13" fill="${PAL.faint}">Internal &#8226; Leadership Only</text>`);
    parts.push(`<text x="${cx+cw}" y="${y}" text-anchor="end" font-family="Inter" font-weight="500" font-size="13" fill="${PAL.faint}">Data as of 2026-08-25</text>`);
    y += 30; // bottom margin

    const H = Math.ceil(y);
    const fontStyle = `<style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');</style>`;
    const bg = `<rect x="0" y="0" width="${W}" height="${H}" fill="${PAL.bg}"/>`;
    return { svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${fontStyle}${bg}${parts.join('')}</svg>`, W, H };
  }

  const built = buildSVG();
  const svgMarkup = built.svg, W_OUT = built.W, H_OUT = built.H;
  document.getElementById('posterWrap').innerHTML = svgMarkup;

  async function rasterizeToCanvas(scale) {
    await document.fonts.ready;
    const blob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    const loaded = new Promise((resolve, reject) => { img.onload = resolve; img.onerror = () => reject(new Error('SVG failed to rasterize')); });
    img.src = url;
    await loaded;
    const canvas = document.createElement('canvas');
    canvas.width = W_OUT * scale; canvas.height = H_OUT * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, W_OUT, H_OUT);
    URL.revokeObjectURL(url);
    return canvas;
  }

  async function canvasToPdfBlob(canvas) {
    const jpegBlob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', 0.92));
    const jpegBytes = new Uint8Array(await jpegBlob.arrayBuffer());
    const w = canvas.width, h = canvas.height;
    const enc = new TextEncoder();
    const chunks = []; let pos = 0; const off = {};
    function push(x) { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); pos += b.length; }
    push('%PDF-1.4\n');
    off[1] = pos; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    off[2] = pos; push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
    off[3] = pos; push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
    off[4] = pos; push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
    push(jpegBytes); push('\nendstream\nendobj\n');
    const content = `q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;
    off[5] = pos; push(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    const xrefStart = pos;
    let xref = 'xref\n0 6\n0000000000 65535 f \n';
    for (let i = 1; i <= 5; i++) xref += String(off[i]).padStart(10,'0') + ' 00000 n \n';
    push(xref);
    push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
    return new Blob(chunks, { type: 'application/pdf' });
  }

  const statusMsg = document.getElementById('statusMsg');
  function setStatus(text, ms) { statusMsg.textContent = text; if (ms) setTimeout(() => { if (statusMsg.textContent === text) statusMsg.textContent = ''; }, ms); }

  async function offer(filename, blob) {
    let downloads;
    try { downloads = await claude.use('downloads'); } catch (e) { downloads = null; }
    if (!downloads) {
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setStatus('Opened in a new tab — save it from there.', 6000);
      return;
    }
    await downloads.save({ filename, data: blob });
    setStatus('Saved.', 4000);
  }

  document.getElementById('downloadBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget; btn.disabled = true; setStatus('Rendering…');
    try {
      const canvas = await rasterizeToCanvas(2);
      const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png'));
      await offer('situation-brief-bcp.png', blob);
    } catch (err) {
      setStatus((err && err.code === 'declined') ? 'Cancelled.' : 'Could not generate the PNG.', 5000);
    } finally { btn.disabled = false; }
  });

  document.getElementById('pdfBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget; btn.disabled = true; setStatus('Rendering…');
    try {
      const canvas = await rasterizeToCanvas(2);
      const blob = await canvasToPdfBlob(canvas);
      await offer('situation-brief-bcp.pdf', blob);
    } catch (err) {
      const code = err && err.code;
      if (code === 'declined') setStatus('Cancelled.', 5000);
      else if (code === 'extension_not_enabled') setStatus('PDF isn\'t available in this view — try Download PNG instead.', 7000);
      else setStatus('Could not generate the PDF.', 5000);
    } finally { btn.disabled = false; }
  });
</script>

</body></html>
