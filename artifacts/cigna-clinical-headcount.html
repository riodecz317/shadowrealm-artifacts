<title>Cigna Clinical Headcount</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap');
  /* Light theme only, unconditionally — dark mode was explicitly rejected for this kind of
     leadership brief, so (unlike some earlier scratchpad pieces) there is no dark-mode
     media query / data-theme override here at all. */
  :root { --ground: #E7EAF0; --ink: #1B2036; --ink-faint: #8891A3; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--ground); color: var(--ink); font-family: "Inter", sans-serif; display: flex; flex-direction: column; }

  .toolbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; gap: 12px; background: #fff; border-bottom: 1px solid #E2E5EC; }
  .toolbar .app-name { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 14px; color: var(--ink); }
  .toolbar .actions { display: flex; gap: 8px; align-items: center; }
  .btn { font-family: "Inter", sans-serif; font-size: 12.5px; font-weight: 700; border-radius: 7px; padding: 8px 13px; border: 1px solid #E2E5EC; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: #F4F5F8; color: var(--ink); }
  .btn.primary { background: #F97316; color: #fff; border-color: transparent; }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .status-msg { font-size: 11.5px; color: var(--ink-faint); }

  .stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: var(--ground); }
  #posterWrap { height: 100%; max-width: 100%; display: flex; }
  #posterWrap svg { height: 100%; width: auto; max-width: 100%; border-radius: 14px; box-shadow: 0 16px 50px rgba(0,0,0,0.18); display: block; background: #fff; }

  @media print {
    body { height: auto; overflow: visible; }
    .toolbar { display: none; }
    .stage { padding: 0; height: 100vh; background: #fff; }
    #posterWrap { height: 100vh; }
    #posterWrap svg { border-radius: 0; box-shadow: none; height: 100vh; width: auto; margin: 0 auto; }
    @page { margin: 0; }
  }
</style>

    // [label, WAH Prod, WAH Support, WAH Trainee, Total]
    ['NON-RN', 171, 38, 2, 211],
    ['PHRN',   85, 31, 4, 120],
    ['USRN',  128, 35, 49, 212],
  ];
  const COL_TOTALS = [384, 104, 55, 543]; // WAH Prod, WAH Support, WAH Trainee, Grand total
  // Row-total check: 211+120+212 = 543. Column-total check: 384+104+55 = 543.

    return labelX;
  }

  function buildSVG() {
    const parts = [];
    let y = 0;
    const cx = COL_X, cw = COL_W;
    const sectionLabel = (text) => { parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="800" font-size="15" letter-spacing="2" fill="${PAL.faint}">${esc(text)}</text>`); y += 34; };
    const rule = (gapAfter) => { parts.push(`<line x1="${cx}" y1="${y}" x2="${cx+cw}" y2="${y}" stroke="${PAL.rule}" stroke-width="1"/>`); y += gapAfter; };

    // ---- Masthead ----
    y = 56;
    parts.push(`<circle cx="${cx+5}" cy="${y-6}" r="4.5" fill="${PAL.accent}"/>`);
    parts.push(`<text x="${cx+16}" y="${y}" font-family="Inter" font-weight="700" font-size="14" letter-spacing="2.2" fill="${PAL.faint}">CLINICAL WORKFORCE &#8226; LEADERSHIP OVERVIEW</text>`);
    parts.push(`<text x="${cx+cw}" y="${y}" text-anchor="end" font-family="Inter" font-weight="700" font-size="13" letter-spacing="1" fill="${PAL.faint}">INTERNAL &#8226; LEADERSHIP ONLY</text>`);

    y += 54;
    parts.push(`<text x="${cx}" y="${y}" font-family="Archivo" font-weight="900" font-size="46" fill="${PAL.ink}">Cigna Clinical &#8212; Headcount Overview</text>`);

    y += 39;
    const subtitle = '543 clinical staff at Cigna Clinical, by role, work status, and sub-process.';
    const subLines = wrapText(subtitle, 92); // fits on one line at this length; wrapText still used so height reflects actual line count
    subLines.forEach((line, i) => parts.push(`<text x="${cx}" y="${y + i*24}" font-family="Inter" font-weight="500" font-size="17" fill="${PAL.muted}">${esc(line)}</text>`));
    y += (subLines.length - 1) * 24 + 30;
    rule(36);

    // ============================================================
    // HERO — total headcount, single largest/most dominant element
    // on the canvas, with the work-status split previewed alongside.
    // ============================================================
    sectionLabel('TOTAL CLINICAL HEADCOUNT');
    const zoneATop = y;
    const heroNumY = zoneATop + 150;
    parts.push(`<text x="${cx}" y="${heroNumY}" font-family="Archivo" font-weight="900" font-size="170" fill="${PAL.accent}">543</text>`);
    // Label sits 65px below the number's baseline. At 170px, the numeral's own
    // descender reaches ~37px below baseline; a 30px offset (the old value) put
    // the label's ascent inside that descender zone instead of clear of it.
    parts.push(`<text x="${cx}" y="${heroNumY+65}" font-family="Inter" font-weight="800" font-size="18" letter-spacing="0.5" fill="${PAL.accentDeep}">CLINICAL STAFF &#8212; CIGNA CLINICAL ACCOUNT</text>`);
    const statsX = cx + 500;
    // Shared label column: based on the widest number among these three rows
    // ("384"/"104", 3 digits) so "55"'s shorter width doesn't pull its label
    // left of the other two — all three labels now start at the same x.
    const statsLabelX = statsX + estWidth('384', 34, 'Archivo', 800) + 16;
    numLabel(parts, statsX, zoneATop + 40, '384', 34, 800, 'WAH Prod', 16, 600, 16, PAL.ink, PAL.faint, statsLabelX);
    numLabel(parts, statsX, zoneATop + 92, '104', 34, 800, 'WAH Support', 16, 600, 16, PAL.ink, PAL.faint, statsLabelX);
    numLabel(parts, statsX, zoneATop + 144, '55', 34, 800, 'WAH Trainee', 16, 600, 16, PAL.ink, PAL.faint, statsLabelX);
    y = zoneATop + 245;
    rule(36);

    // ============================================================
    // ROLE x WORK STATUS grid — 5x5 (label row/col + 3 roles + total),
    // fixed column widths, centered numbers: overlap-proof by construction.
    // ============================================================
    sectionLabel('ROLE × WORK STATUS');
    const gridTop = y;
    const labelColW = 220, dataColW = (cw - labelColW) / 4; // 265
    const headerRowH = 60, dataRowH = 76;
    const colX = [cx, cx + labelColW, cx + labelColW + dataColW, cx + labelColW + 2*dataColW, cx + labelColW + 3*dataColW];
    const colCenter = (i) => colX[i] + dataColW / 2; // i = 1..4 (data columns)
    const headers = ['WAH PROD', 'WAH SUPPORT', 'WAH TRAINEE', 'TOTAL'];

    // Total-column highlight strip (behind all text) across header + 3 role rows.
    parts.push(`<rect x="${colX[4]}" y="${gridTop}" width="${dataColW}" height="${headerRowH + 3*dataRowH}" fill="${PAL.track}"/>`);
    // Header row background.
    parts.push(`<rect x="${cx}" y="${gridTop}" width="${cw}" height="${headerRowH}" fill="${PAL.headerTint}"/>`);
    parts.push(`<text x="${cx+20}" y="${gridTop + headerRowH/2 + 5}" font-family="Inter" font-weight="800" font-size="13" letter-spacing="1" fill="${PAL.faint}">PROFILE</text>`);
    headers.forEach((h, i) => {
      parts.push(`<text x="${colCenter(i+1)}" y="${gridTop + headerRowH/2 + 5}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="13" letter-spacing="1" fill="${PAL.faint}">${esc(h)}</text>`);
    });

    // Role rows.
    ROLES.forEach((row, i) => {
      const rowY = gridTop + headerRowH + i*dataRowH;
      const baseline = rowY + dataRowH/2 + 9;
      parts.push(`<text x="${cx+20}" y="${baseline-1}" font-family="Inter" font-weight="700" font-size="18" fill="${PAL.ink}">${esc(row[0])}</text>`);
      [row[1], row[2], row[3]].forEach((v, ci) => {
        parts.push(`<text x="${colCenter(ci+1)}" y="${baseline}" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="28" fill="${PAL.ink}">${v}</text>`);
      });
      parts.push(`<text x="${colCenter(4)}" y="${baseline}" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="28" fill="${PAL.accentDeep}">${row[4]}</text>`);
    });

    // Total row — full-width tint + left accent bar, like the recommendation
    // panel treatment in situation-brief.html, to mark it as the summary row.
    const totalRowY = gridTop + headerRowH + 3*dataRowH;
    parts.push(`<rect x="${cx}" y="${totalRowY}" width="${cw}" height="${dataRowH}" fill="${PAL.accentTint}"/>`);
    parts.push(`<rect x="${cx}" y="${totalRowY}" width="6" height="${dataRowH}" fill="${PAL.accent}"/>`);
    const totalBaseline = totalRowY + dataRowH/2 + 9;
    parts.push(`<text x="${cx+20}" y="${totalBaseline-1}" font-family="Inter" font-weight="800" font-size="18" fill="${PAL.accentDeep}">Total</text>`);
    COL_TOTALS.slice(0,3).forEach((v, ci) => {
      parts.push(`<text x="${colCenter(ci+1)}" y="${totalBaseline}" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="28" fill="${PAL.accentDeep}">${v}</text>`);
    });
    parts.push(`<text x="${colCenter(4)}" y="${totalBaseline+2}" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="32" fill="${PAL.accent}">${COL_TOTALS[3]}</text>`);

    // Row separators + a couple of vertical guide rules (decoration only — no extra height).
    [gridTop+headerRowH, gridTop+headerRowH+dataRowH, gridTop+headerRowH+2*dataRowH, totalRowY].forEach(ly => {
      parts.push(`<line x1="${cx}" y1="${ly}" x2="${cx+cw}" y2="${ly}" stroke="${PAL.rule}" stroke-width="1"/>`);
    });
    parts.push(`<line x1="${colX[1]}" y1="${gridTop}" x2="${colX[1]}" y2="${totalRowY+dataRowH}" stroke="${PAL.rule}" stroke-width="1"/>`);
    parts.push(`<line x1="${colX[4]}" y1="${gridTop}" x2="${colX[4]}" y2="${totalRowY+dataRowH}" stroke="${PAL.rule}" stroke-width="1"/>`);
    parts.push(`<rect x="${cx}" y="${gridTop}" width="${cw}" height="${headerRowH+4*dataRowH}" fill="none" stroke="${PAL.rule}" stroke-width="1"/>`);

    const gridBottom = totalRowY + dataRowH;
    y = gridBottom + 30;
    rule(36);

    // ============================================================
    // SUB-PROCESS BREAKDOWN — top 10 of 23 by headcount, individually
    // ranked, plus one "Other" bar carrying the remaining 13 combined.
    // Bars are scaled against the largest bar shown (105, the Other
    // bucket) so nothing overflows the canvas; Other is drawn in a
    // visually distinct neutral tone + italic label so it reads as a
    // rollup category, not as the single biggest sub-process.
    // ============================================================
    sectionLabel('SUB-PROCESS BREAKDOWN — TOP 10 OF 23 BY HEADCOUNT');
    const barsTop = y;
    const barRows = SUBPROC_TOP10.map(([label, val], i) => ({ label, val, other: false, isTop1: i === 0 }))
      .concat([{ label: `Other — ${OTHER_COUNT} more sub-processes, combined HC of ${OTHER_TOTAL}`, val: OTHER_TOTAL, other: true, isTop1: false }]);
    const maxBarVal = Math.max(...barRows.map(r => r.val)); // 105 (the Other bucket)
    const barX = cx + 500, barMaxW = 650, rowGap = 36;
    barRows.forEach((r, i) => {
      const by = barsTop + 22 + i*rowGap;
      const barY = by - 10, barH = 12;
      const fillColor = r.other ? PAL.otherBar : (r.isTop1 ? PAL.accent : PAL.muted);
      const labelColor = r.other ? PAL.faint : PAL.ink;
      const style = r.other ? ' font-style="italic"' : '';
      parts.push(`<text x="${cx}" y="${by}" font-family="Inter" font-weight="700"${style} font-size="15" fill="${labelColor}">${esc(r.label)}</text>`);
      parts.push(`<rect x="${barX}" y="${barY}" width="${barMaxW}" height="${barH}" rx="6" fill="${PAL.track}"/>`);
      parts.push(`<rect x="${barX}" y="${barY}" width="${barMaxW * (r.val/maxBarVal)}" height="${barH}" rx="6" fill="${fillColor}"/>`);
      parts.push(`<text x="${barX+barMaxW+20}" y="${by}" font-family="Archivo" font-weight="800" font-size="17" fill="${r.other ? PAL.muted : PAL.ink}">${r.val}</text>`);
    });
    y = barsTop + 22 + (barRows.length-1)*rowGap + 32;
    rule(24);

    // ---- Footer: the shown+Other reconciliation, in plain sight ----
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="600" font-size="13" fill="${PAL.faint}">10 shown individually + 13 in &#8220;Other&#8221; = 23 sub-processes, totaling 543 HC.</text>`);
    parts.push(`<text x="${cx+cw}" y="${y}" text-anchor="end" font-family="Inter" font-weight="500" font-size="13" fill="${PAL.faint}">Source: Clinical Heatmap.xlsx, SharePoint (ClinicalPillar2) &#8226; Prepared 2026-08-25</text>`);
    y += 30; // bottom margin

    const H = Math.ceil(y);
    const fontStyle = `<style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');</style>`;
    const bg = `<rect x="0" y="0" width="${W}" height="${H}" fill="${PAL.bg}"/>`;
    return { svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${fontStyle}${bg}${parts.join('')}</svg>`, W, H };
  }

  const built = buildSVG();
  const svgMarkup = built.svg, W_OUT = built.W, H_OUT = built.H;
  document.getElementById('posterWrap').innerHTML = svgMarkup;

  async function rasterizeToCanvas(scale) {
    await document.fonts.ready;
    const blob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    const loaded = new Promise((resolve, reject) => { img.onload = resolve; img.onerror = () => reject(new Error('SVG failed to rasterize')); });
    img.src = url;
    await loaded;
    const canvas = document.createElement('canvas');
    canvas.width = W_OUT * scale; canvas.height = H_OUT * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, W_OUT, H_OUT);
    URL.revokeObjectURL(url);
    return canvas;
  }

  async function canvasToPdfBlob(canvas) {
    const jpegBlob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', 0.92));
    const jpegBytes = new Uint8Array(await jpegBlob.arrayBuffer());
    const w = canvas.width, h = canvas.height;
    const enc = new TextEncoder();
    const chunks = []; let pos = 0; const off = {};
    function push(x) { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); pos += b.length; }
    push('%PDF-1.4\n');
    off[1] = pos; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    off[2] = pos; push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
    off[3] = pos; push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
    off[4] = pos; push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
    push(jpegBytes); push('\nendstream\nendobj\n');
    const content = `q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;
    off[5] = pos; push(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    const xrefStart = pos;
    let xref = 'xref\n0 6\n0000000000 65535 f \n';
    for (let i = 1; i <= 5; i++) xref += String(off[i]).padStart(10,'0') + ' 00000 n \n';
    push(xref);
    push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
    return new Blob(chunks, { type: 'application/pdf' });
  }

  const statusMsg = document.getElementById('statusMsg');
  function setStatus(text, ms) { statusMsg.textContent = text; if (ms) setTimeout(() => { if (statusMsg.textContent === text) statusMsg.textContent = ''; }, ms); }

  async function offer(filename, blob) {
    let downloads;
    try { downloads = await claude.use('downloads'); } catch (e) { downloads = null; }
    if (!downloads) {
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setStatus('Opened in a new tab — save it from there.', 6000);
      return;
    }
    await downloads.save({ filename, data: blob });
    setStatus('Saved.', 4000);
  }

  document.getElementById('downloadBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget; btn.disabled = true; setStatus('Rendering…');
    try {
      const canvas = await rasterizeToCanvas(2);
      const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png'));
      await offer('cigna-clinical-headcount-overview.png', blob);
    } catch (err) {
      setStatus((err && err.code === 'declined') ? 'Cancelled.' : 'Could not generate the PNG.', 5000);
    } finally { btn.disabled = false; }
  });

  document.getElementById('pdfBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget; btn.disabled = true; setStatus('Rendering…');
    try {
      const canvas = await rasterizeToCanvas(2);
      const blob = await canvasToPdfBlob(canvas);
      await offer('cigna-clinical-headcount-overview.pdf', blob);
    } catch (err) {
      const code = err && err.code;
      if (code === 'declined') setStatus('Cancelled.', 5000);
      else if (code === 'extension_not_enabled') setStatus('PDF isn\'t available in this view — try Download PNG instead.', 7000);
      else setStatus('Could not generate the PDF.', 5000);
    } finally { btn.disabled = false; }
  });
</script>

</body></html>
